<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <style>
      .letter { font-family: "Manrope", "Ubuntu Sans", "Helvetica Neue", system-ui, sans-serif; font-weight: 800; font-size: 100px; letter-spacing: -2px; }
    </style>
  </defs>
  <!-- white background -->
  <rect x="0" y="0" width="256" height="256" fill="#FFFFFF"/>
