[package]
name = "miracle-claw"
version = "1.0.0"
description = "Miracle Claw — desktop chat shell wrapping OpenClaw WebChat + MAIC"
authors = ["ADeal Auto Repair"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "miracle_claw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "miracle-claw"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]