[package]
name = "miracle-claw"
version = "1.1.0-rc55.19"
description = "Miracle Claw — Milagro Distribution Corp's desktop chat client for MAIC models"
authors = ["Milagro Distribution Corp"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "miracle_claw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "miracle-claw"
path = "src/main.rs"

# Sidecar: spawned by miracle-claw via tauri-plugin-shell sidecar model.
# Lives in a separate bin entry so Tauri's capability file can declare an
# allowlist with `name: "miracle-claw-launcher"`, and so this binary can be
# tested/built independently of the Tauri webview process.
[[bin]]
name = "miracle-claw-launcher"
path = "src/launcher.rs"

# v1.0.7: local tool executor. Spawned by the MAIC plugin (the JS file
# in `depot/maic-plugin/index.js`) when the model invokes one of the 7
# paid-tier tools. Reads the tool name from argv[1], JSON params from
# stdin, writes the result to stdout. Stdout is the tool result the
# model sees; non-zero exit = error string on stderr.
#
# Why a separate binary instead of going through Tauri's invoke:
#   - The plugin runs in OpenClaw's bundled Node process, which has no
#     handle on Tauri's IPC. Shelling out to a known binary is the
#     OpenClaw-blessed pattern.
#   - Keeping the executor in its own process means a tool that
#     panics (e.g. bad symlink handling) can't take down the chat
#     UI.
#   - The tool executor stays small (~ 300 KB) instead of bloating
#     the chat process.
[[bin]]
name = "miracle-claw-tools"
path = "src/tools_main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# Pinned to exact versions to keep Tauri runtime + plugin in lockstep between
# dev builds and Windows MSVC cross-compile builds. Float = "2.0" was the
# original scaffold; we tighten here.
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-shell = "=2.3.5"
# rc49 (feature/drag-drop): reliable OS clipboard for the "Send to chat"
# handoff. navigator.clipboard.writeText() in JS depends on the webview
# being focused, which fails silently if the user clicked Send right
# after dropping a file. The Rust plugin writes directly to the OS
# clipboard via Win32 / cocoa / xclip — no focus required.
tauri-plugin-clipboard-manager = "=2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
# Lesson 444: maic_login() needs an HTTP client. We don't enable the heavy
# `blocking` feature (which would pull in tokio) — the sync API is enough
# for one login POST.
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
# v1.0.7: lazy statics for tier + quota caches. Cheap, std::sync::Mutex
# backed, ~no overhead.
once_cell = "1"
# Lesson 458 / v1.0.6: silent-relogin via cached email+password. Stashed in OS
# keychain (Windows Credential Manager / macOS Keychain / Linux Secret Service)
# encrypted with a per-install AES-256-GCM key. See src/auto_relogin.rs.
#
# v3.x dropped the `mock` feature — roundtrip tests are done against the
# pure encrypt/decrypt helpers (`encrypt_blob`, `decrypt_blob`) which take
# the key as input. The keychain integration is one end-to-end test that
# runs on David's machine before each release.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

# Phase 3 mobile pairing (spec: docs/specs/mobile-desktop-pairing.md).
# Wire-compatible with the Dart side using the `cryptography 2.9.0` package.
# x25519-dalek for the ephemeral/static DH; hkdf + sha2 + hmac for the
# session-key derivation and per-request HMAC binding; aes-gcm was already
# pinned at 0.10 for secrets_encryption.rs. Keep these in sync with the
# Dart test fixtures in miracle-claw-mobile/test/pairing_compat_test.dart.
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"

# Phase 3 mobile pairing — mDNS advertisement deferred to a follow-up
# commit. The desktop LAN shortcut uses the zeroconf crate which pulls in
# avahi-sys on Linux and bindgen, requiring libclang to build. The pairing
# spec says mDNS is opportunistic — MAIC presence relay is primary — so
# shipping the 6 Tauri commands without it is correct. When libclang is
# available in the dev environment, add:
#   zeroconf = "0.18"

# Tiny HTTP server for accepting phone-side pairing requests (LAN or via
# MAIC-relayed HTTPS tunnel). tiny_http is the simplest sync HTTP server
# that doesn't pull in tokio. The phone hits POST /v1/pair/initiate with
# {phone_pubkey, device_name}, and gets back the handshake response. Same
# endpoint validates per-request HMACs for ongoing session traffic.
tiny_http = "0.12"
# Used by auto_relogin to zero out decrypted secrets before drop, so they don't
# linger in process memory.
zeroize = { version = "1", features = ["zeroize_derive"] }

# v1.1.0-rc53.17 (Lesson 574c): wire install_from_url for URL-distributed modules.
#  - reqwest: streaming HTTP client (rustls only — no OpenSSL, works on Linux + Windows MSVC)
#  - tar + flate2: portable tarball extraction (handles .tar.gz shipped from GitHub releases)
#  - uuid: per-install tmp dir suffix so concurrent installs never collide
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tar = "0.4"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }

# feat/mc-tasks: tasks feature for MC v1.1.0+ (Miracle Bot persistent
# memory). Adds the on-disk task list, MAIC sync engine, and Tauri commands
# behind a paid-tier gate. Models + storage + sync reuse the shape proven
# in the adeal-schedule test program (v0.1.0, Aug 22 2026) — see Lesson
# 725 (this lesson) for the cut/paste rationale.
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
anyhow = "1"

[dev-dependencies]
regex = "1.13.1"
# Test-only dependency for unit tests in src/lib.rs. tempfile is well-
# maintained and only used by the ensure_maic_provider_config tests that
# need an isolated HOME for openclaw_extensions_dir() to resolve to a temp
# dir. Never linked into the production binary.
tempfile = "3"
url = "2.5.8"
urlpattern = "0.6.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# --------------------------------------------------------------------
# Dependency audit checklist (Lesson 351):
#   - All three version strings (Cargo.toml, tauri.conf.json, package.json)
#     read `1.0.0`. Bump together when shipping.
#   - tauri + tauri-plugin-shell + tauri-build pinned to exact patches above.
#   - serde 1.x + serde_json 1.x are stable; float is fine.
# --------------------------------------------------------------------
