# Default permission set for the MiracleClaw app — exposes all custom
# Tauri commands. Referenced as `default` in capabilities/<file>.json.
[default]
description = "Default permissions for MiracleClaw backend commands."
permissions = [
  "allow-back-to-dashboard",
  "allow-first-run-report",
  "allow-maic-login",
  "allow-maic-logout",
  "allow-silent-relogin",
  "allow-start-gateway-after-login",
  "allow-openclaw-open-window",
  "allow-open-register-url",
  "allow-mc-get-tier",
  "allow-mc-get-nudge",
  "allow-mc-list-tools",
  "allow-mc-refresh-tier",
  "allow-mc-apply-tier-change",
  # rc53.12 (Lesson 561): in-app upgrade flow on the dashboard
  # Plans card. Free users see live pricing pulled from MAIC;
  # clicking a plan opens Stripe Checkout in the OS default browser.
  "allow-mc-get-quota",
  "allow-mc-list-plans",
  "allow-mc-open-checkout-url",
  # rc56.0: module-driven surfaces (spec docs/mc-module-driven-surfaces-2026-09.md)
  "allow-mc-list-categories",
  "allow-mc-list-marketplace-modules",
  "allow-mc-list-installed-modules",
  "allow-mc-install-module",
  "allow-mc-uninstall-module",
  "allow-mc-run-module",
  # v1.0.9-rc35: Settings page commands
  "allow-mc-get-user-info",
  "allow-mc-list-memory-files",
  "allow-mc-read-memory-file",
  "allow-mc-write-memory-file",
  "allow-mc-open-data-folder",
  "allow-mc-open-overlay",
  "allow-mc-close-overlay",
  # v1.0.9-rc36: Terminal tab commands
  "allow-mc-terminal-start",
  "allow-mc-terminal-poll",
  "allow-mc-terminal-write",
  "allow-mc-terminal-kill",
  "allow-mc-terminal-list",
  # v1.0.9-rc47: UI-facing file browser commands
  "allow-mc-ui-list-allowed-roots",
  "allow-mc-ui-list-dir",
  "allow-mc-ui-read-file",
  # v1.0.0-prep: image preview + open-in-default-app handoff for
  # binaries (PDF, Office, archives). Newbie-facing UX.
  "allow-mc-ui-read-image",
  "allow-mc-ui-open-externally",
  # v1.1.0-prep (feature/drag-drop): drag-and-drop attachment staging
  # for the dashboard drop zone + send-to-chat handoff.
  "allow-mc-stage-attachment",
  "allow-mc-list-attachments",
  "allow-mc-remove-attachment",
  "allow-mc-clear-attachments",
  "allow-mc-send-attachments-to-chat",
  # rc53 (feature/secrets-vault): local encrypted secrets vault.
  # v0 plaintext JSON; crypto in rc54. Threat model locked in
  # notes/SECRETS-VAULT.md. Plaintext never crosses the network.
  "allow-mc-secret-set",
  "allow-mc-secret-delete",
  "allow-mc-secret-list",
  "allow-mc-secret-expand",
  "allow-mc-secret-debug-dump",
  # rc53.6 (feature/secrets-vault): friendly setter + in-memory pool
  # (Once / PerSession / Vault lifetimes). Single Mutex<HashMap<...>>
  # with a Lifetime enum; canonicalize_label() turns user-typed labels
  # into shell-var names. See src/secrets_friendly.rs.
  "allow-mc-secret-set-friendly",
  "allow-mc-secret-list-ephemerals",
  "allow-mc-secret-clear-session-ephemerals",
  "allow-mc-secret-clear-all-ephemerals",
  # v1.1.0-rc53.15 (Lesson 570): MC Module Framework. Voice is the
  # first module; future modules (OCR, TTS, local search) follow the
  # same pattern. mc-module-call is the umbrella permission that lets
  # the JS side dispatch to any installed module's sidecar.
  "allow-mc-module-list",
  "allow-mc-module-install-local",
  "allow-mc-module-uninstall",
  "allow-mc-module-call",
  # Lesson 706 (rc54.3): native Windows STT (SAPI 5) and voice
  # diagnostics. Voice-diagnostics was missing from the ACL even
  # though it shipped — closed the gap while adding the new capture
  # command.
  "allow-voice-diagnostics",
  "allow-voice-open-sound-settings",
  "allow-voice-open-windows-update",
  "allow-mc-voice-native-capture",
  # Lesson 755 (rc55.5): MC Tasks page backend commands (Lesson 725).
  # These were wired in Rust since rc54.6 but the autogenerated ACL
  # never picked them up (Lesson 219 / sccache trap — autogeneration
  # step skipped on this host). Closed the gap so the Tasks page can
  # actually call into the Rust backend instead of getting
  # "Command mc_tasks_page not allowed by ACL" on every mount.
  "allow-mc-tasks-page",
  "allow-mc-task-add",
  "allow-mc-task-update",
  "allow-mc-task-done",
  "allow-mc-task-delete",
  "allow-mc-task-sync",
  "allow-mc-task-login",
  # Lesson 836 (rc55.23 fix): MC Workflows / OpenProse backend commands
  # (Lesson 833). The 5 commands — prose_run / prose_compile / prose_poll
  # / prose_kill / prose_examples — were added to prose_host.rs in
  # rc55.22 but the autogenerated permissions file was stale (same trap
  # as Lesson 755) and the entries were never added to default.toml or
  # capabilities/main.json. Symptom: clicking the Workflows tile
  # navigated to a page showing "Could not load the workflow library"
  # because prose_examples invoke was silently rejected by the ACL.
  # Tauri 2's invoke error from a denied ACL is the literal string
  # "Command prose_examples not allowed by ACL" — our catch block
  # was swallowing it behind a friendly user message, hiding the cause.
  # v1.2.0 (Phase 5): desktop workspace sync commands.
  # Every custom Tauri command MUST be listed here AND in
  # capabilities/main.json — adding it to one alone is NOT enough
  # (Tauri 2 reads the JSON for the runtime ACL).
  "allow-mc-workspace-status",
  "allow-mc-workspace-refresh-jwt",
  "allow-prose-run",
  "allow-prose-compile",
  "allow-prose-poll",
  "allow-prose-kill",
  "allow-prose-examples",
  # Lesson 836 (rc55.23 fix, batch 2): Provider Keys page backend
  # commands. mc_set_provider_key / mc_list_provider_keys /
  # mc_clear_provider_key were added in v1.0.x but the autogenerated
  # ACL never picked them up. Symptom (latent — clicked from
  # Settings > Provider Keys): the page would call
  # invoke("mc_list_provider_keys") and hit the same
  # 'Command mc_list_provider_keys not allowed by ACL' error.
  "allow-mc-set-provider-key",
  "allow-mc-list-provider-keys",
  "allow-mc-clear-provider-key",
  # Lesson 836 (rc55.23 fix, batch 3): Paired Devices page backend
  # commands + device-pairing lifecycle. All 8 commands are
  # reachable from the JS UI at tauri://localhost/index.html (main
  # window) and were missing from main.json. Same Lesson 755 trap.
  "allow-mc-get-pairing-status",
  "allow-mc-initiate-pair",
  "allow-mc-paired-devices",
  "allow-mc-register-desktop",
  "allow-mc-register-desktop-self",
  "allow-mc-restore-pairing-identity",
  "allow-mc-revoke-device",
  "allow-mc-set-drop-folder",
  "allow-mc-unregister-desktop",
  # Lesson 836 (rc55.23 fix, batch 4): Tier maintenance command.
  # mc_set_tier_defaults is currently called only from Rust setup
  # hooks and CLI maintenance paths, but adding the ACL entry
  # proactively keeps the autogenerated ACL consistent for future
  # use. Same root cause as the other batches.
  "allow-mc-set-tier-defaults",
  # Lesson 836 (rc55.23 fix, batch 5): bridge.json-only commands.
  # These commands are NOT in main.json (intentionally — they're
  # scoped to the chat bridge origin at http://127.0.0.1:28789 to
  # keep the dashboard's permission surface minimal), but they
  # still need to live in `default` (this file's [default] section)
  # so capability definitions can resolve them. bridge.json is the
  # ONLY capability that lists them.
  "allow-mc-module-install-url",
  "allow-openclaw-back-to-dashboard"
]
